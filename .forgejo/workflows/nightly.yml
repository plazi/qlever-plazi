# Nightly QLever index build for qlever.ld.plazi.org, see README.md.
# Runs on a Forgejo runner on the QLever host itself (label `qlever-host`,
# host executor): the build needs the host's disk, memory and Docker.
name: nightly

on:
  schedule:
    - cron: "14 0 * * *" # 02:14 CEST
  workflow_dispatch:
    inputs:
      force:
        description: Build even if hooknq and CoL did not change
        type: boolean
        default: false

concurrency:
  group: qlever-plazi
  cancel-in-progress: false

jobs:
  build:
    runs-on: qlever-host
    timeout-minutes: 240
    steps:
      - name: Checkout
        run: |
          rm -rf repo
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" repo
      - name: Build, check and promote
        env:
          QP_FORCE: ${{ inputs.force && '1' || '0' }}
        run: repo/scripts/qlever-plazi.sh run
